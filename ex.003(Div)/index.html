<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            width: 100%;
        }

        .quadro {
            border: 2px solid black;
            box-sizing: border-box;
            padding: 100px;
            text-align: center;
        }

        .quadro1 {
            width: 99%;
             background-color: yellow;
        }

        .quadro2 {
            display: inline-block;
            width: 49.5%;
            color:red
        }
        .quadro3 {
            display: inline-block;
            width: 49.5%;
        }
    </style>
    <title>Div</title>
</head>

<body>
    <div class="container">
        <div class="quadro quadro1">Quadro 1</div>
        <div class="quadro quadro2">Quadro 2</div>
        <div class="quadro quadro3">Quadro 3</div>
    </div>
</body>

</html>
